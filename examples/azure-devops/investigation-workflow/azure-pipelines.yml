# Thin wrapper for THIS repository's own acceptance test (framework = self).
# Queue manually; there is intentionally no completion trigger. See README.md.
#
# Prerequisites (see README.md): the Foundry variable group named below, an Azure service
# connection chosen at queue time, and read permission for the project's build service.
# For the acceptance run, supply the evaluation case named in README.md as evaluationCase.
# Capture policy and evaluation case paths are relative to this repository.
# Other repositories should start from consumer-example.yml and pin the framework.
name: investigate-build-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: failedBuildId
    displayName: Failed build ID to investigate
    type: number
  - name: azureServiceConnection
    displayName: Azure service connection used only by the Analyze stage
    type: string
  - name: approvalReviewers
    displayName: Reviewers to notify (semicolon-separated users or groups)
    type: string
  - name: approvalTimeoutMinutes
    displayName: Minutes to wait for approval before the run is rejected
    type: number
    default: 240
  - name: evaluationCase
    displayName: Repo-relative evaluation case (blank skips evaluation)
    type: string
    default: ''

stages:
  - template: /templates/azure-devops/investigate-failed-build.yml
    parameters:
      # Framework and consumer are the same repository here; consumers pin a tag instead.
      failedBuildId: ${{ parameters.failedBuildId }}
      frameworkRepository: self
      capturePolicy: config/azure-devops-build.example.json
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
      foundryVariableGroup: k8s-ai-investigation-foundry
      approvalReviewers: ${{ parameters.approvalReviewers }}
      approvalTimeoutMinutes: ${{ parameters.approvalTimeoutMinutes }}
      evaluationCase: ${{ parameters.evaluationCase }}
