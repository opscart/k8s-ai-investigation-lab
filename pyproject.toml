[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-ai-investigation-lab"
version = "0.1.0"
description = "Evaluate Foundry investigations grounded in application source and captured Kubernetes evidence"
requires-python = ">=3.11"
dependencies = [
  "azure-ai-projects>=2.0,<3",
  "azure-identity>=1.20,<2",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
investigate = "investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investigator = ["prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
